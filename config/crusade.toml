# Crusade configuration. Copy to ./crusade.toml and edit.

[database]
path = "crusade.db"

[scan]
# Conservative defaults. Connect-and-read only.
connect_timeout_ms = 3000
max_concurrent     = 50
rate_per_sec       = 100          # connection attempts/sec (targeted scans)
default_ports      = [21,22,23,25,53,80,110,143,443,445,3306,3389,5432,6379,8080,8443,9200,27017]
allow_private      = false        # true only to scan your OWN rig (127.0.0.1 / LAN)
blocklist_path     = "blocklist.txt"

[sweep]
# IPv4 sweep mode is SCAFFOLDED, not run from this machine.
# A live sweep needs a VPS/ISP that permits scanning and is YOUR responsibility.
enabled            = false
rate_per_sec       = 0            # must be set explicitly; no default
source_identity    = "crusade-scanner"
abuse_contact      = "research@euroswarms.eu"
optout_url         = "http://example.org/scan-optout"

[web]
bind = "127.0.0.1:8088"

[data]
dir = "data"
nmap_probes = "/usr/share/nmap/nmap-service-probes"

[lifecycle]
# A service that stops answering is not deleted on the first miss (a single
# miss is usually packet loss or rate limiting). It is marked pending, stays
# visible, and is evicted only after this window. A host left with no services
# is dropped from the index after forget_after_days.
evict_after_hours = 72
forget_after_days = 60

[archive]
# Retention. Data that has neither answered nor been looked at for a long time
# is written to a gzipped JSONL archive under <data dir>/archive/ and then
# deleted. `crusade archive --status` shows where the space is going;
# `crusade archive --dry-run` says what would go.
history_days         = 180   # timeline entries (newest per service always kept)
alerts_days          = 90    # delivered alerts only; undelivered are kept
jobs_days            = 30    # finished queue jobs
host_stale_days      = 180   # a host must be unseen this long to qualify...
host_unaccessed_days = 90    # ...and unvisited this long (never = forever)
# Archive automatically once the database passes this size, after a scan or a
# monitor pass. 0 disables it, and nothing is ever removed without a run of
# `crusade archive`.
max_db_mb            = 0

[alert]
# Transports for `crusade monitor`. All optional — with none set, alerts are
# only recorded (view with `crusade alerts`).
webhooks   = []                 # e.g. ["https://hooks.slack.com/services/XXX"]
# smtp_host  = "smtp.example.org"
# smtp_port  = 587
# smtp_user  = "crusade"
# smtp_pass  = "..."
# email_from = "crusade@example.org"
# email_to   = ["secops@example.org"]
