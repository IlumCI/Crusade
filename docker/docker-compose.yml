# Local test rig for Crusade. These are deliberately-exposed services on
# localhost so `crusade scan 127.0.0.1 --allow-private` has something to find.
# This is the ONLY sanctioned scan target for development. Do not point Crusade
# at hosts you do not own or are not explicitly authorised to scan.
services:
  web-nginx:
    image: nginx:1.18.0            # old on purpose: exercises version + CVE tagging
    ports: ["127.0.0.1:8081:80"]

  web-apache:
    image: httpd:2.4
    ports: ["127.0.0.1:8082:80"]

  tls-selfsigned:
    # nginx serving a self-signed cert: exercises TLS parse + self-signed tag.
    image: nginx:alpine
    volumes:
      - ./selfsigned:/etc/nginx/certs:ro
      - ./selfsigned/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:8443:443"]
    depends_on: [gen-cert]

  gen-cert:
    # one-shot: generate a self-signed cert into the shared volume
    image: alpine/openssl
    volumes: ["./selfsigned:/certs"]
    entrypoint: >
      sh -c "test -f /certs/cert.pem ||
      openssl req -x509 -newkey rsa:2048 -nodes -days 365
      -keyout /certs/key.pem -out /certs/cert.pem
      -subj '/CN=test.crusade.local'"

  ssh-old:
    image: linuxserver/openssh-server:latest
    environment: [PASSWORD_ACCESS=false, USER_NAME=test]
    ports: ["127.0.0.1:2222:2222"]

  redis-open:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
